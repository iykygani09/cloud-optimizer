AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Real-Time Multi-Cloud Carbon Footprint & Cost Optimizer Backend (V1)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  TableName:
    Type: String
    Default: AnalysisHistory
  DatasetVersion:
    Type: String
    Default: 2026-09-23

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64
    Runtime: nodejs20.x
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        DATASET_VERSION: !Ref DatasetVersion
        NODE_ENV: !Ref Environment

Resources:
  # HTTP API Gateway with CORS, Throttling, and logging
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Client-Id
          - Authorization
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        MaxAge: 600

  # Single DynamoDB Table for Analysis History with TTL
  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Main API Handler Lambda
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetMeta:
          Type: HttpApi
          Properties:
            Path: /meta
            Method: GET
            ApiId: !Ref HttpApi
        PostAnalyses:
          Type: HttpApi
          Properties:
            Path: /analyses
            Method: POST
            ApiId: !Ref HttpApi
        GetAnalyses:
          Type: HttpApi
          Properties:
            Path: /analyses
            Method: GET
            ApiId: !Ref HttpApi
        GetAnalysisById:
          Type: HttpApi
          Properties:
            Path: /analyses/{id}
            Method: GET
            ApiId: !Ref HttpApi
        DeleteAnalysisById:
          Type: HttpApi
          Properties:
            Path: /analyses/{id}
            Method: DELETE
            ApiId: !Ref HttpApi

  # CloudWatch Log Group with 7 days retention
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 7

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableNameOutput:
    Description: DynamoDB Table Name
    Value: !Ref HistoryTable
